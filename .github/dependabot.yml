# Avisa de dependência com vulnerabilidade conhecida e abre PR de atualização.
# Os PRs passam pelos mesmos portões do CI.
#
# Dois grupos, porque o risco é diferente:
#   app          o que vai dentro do instalador, ou o monta. Integra só com o mantenedor.
#   ferramentas  lint, teste, tipos, formatação. Integra sozinho se o CI passar
#                (.github/workflows/dependabot-auto-merge.yml).
# Atualização major fica fora dos grupos: um PR por pacote, sempre com o mantenedor.
#
# cooldown: a versão nova só é proposta 7 dias depois de sair. Pacote comprometido
# costuma ser descoberto e retirado nesse prazo. Atualização de segurança não espera.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Os tipos do Node descrevem o Node que vem dentro do Electron (o 45 traz o
      # Node 24). A major sobe à mão, junto com a do Electron.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 ainda não: o eslint-plugin-react 7.37.5 (última versão, nov/2026)
      # declara peer eslint ^9.7 e quebra na 10 (context.getFilename e
      # sourceCode.getAllComments saíram da API). Rever quando sair uma versão dele com
      # eslint ^10 no peerDependencies (jsx-eslint/eslint-plugin-react#3977, PR #4022);
      # aí remova este ignore e atualize os dois juntos.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      # O Vite empacota no app tudo o que o código importa, inclusive o que está em
      # devDependencies (electron, react, react-dom); a cadeia de build escreve o
      # instalador. Os dois entram aqui. Pacote novo que o app importe entra nesta
      # lista e no exclude-patterns abaixo (tests/esteira/dependabot-grupos.test.ts).
      app:
        update-types: [minor, patch]
        patterns:
          - '@ant-design/*'
          - '@electron-toolkit/utils'
          - '@tanstack/*'
          - 'antd'
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - 'zod'
          - 'electron'
          - 'electron-builder'
          - 'electron-vite'
          - 'vite'
          - '@vitejs/*'
      ferramentas:
        dependency-type: development
        update-types: [minor, patch]
        # Redundante com a ordem dos grupos, de propósito: um pacote do app nunca
        # pode cair no grupo que integra sozinho.
        exclude-patterns:
          - '@ant-design/*'
          - '@electron-toolkit/utils'
          - '@tanstack/*'
          - 'antd'
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - 'zod'
          - 'electron'
          - 'electron-builder'
          - 'electron-vite'
          - 'vite'
          - '@vitejs/*'

  # As actions estão fixadas por SHA; sem isto elas envelheceriam sem aviso.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
