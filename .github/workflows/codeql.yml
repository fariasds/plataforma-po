# Análise estática do GitHub (CodeQL) sobre o TypeScript do app.
# Os alertas aparecem na aba Security; o badge do README mostra se a última rodou.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Toda segunda: regras novas do CodeQL pegam código antigo.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: TypeScript não precisa compilar para ser analisado, e
      # assim nenhum script de dependência roda neste job.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
