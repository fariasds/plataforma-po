# Portões automáticos em todo PR e em todo push na main.
# O verify:neutral roda sem a lista de termos (ela não é pública) e só informa.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions fixadas por SHA de commit: uma tag pode ser movida, um SHA não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # RN-SEC-28: em todos os arquivos, não só nos do PR. Quem abre PR não roda o
      # hook de pre-commit; esta é a barreira que vale para todos.
      - name: Varredura de credenciais
        run: node scripts/scan-secrets.mjs

      - run: npm ci

      - run: npm run check

      # Só no PR: o instalador exato que vai ser aprovado, para o mantenedor testar
      # antes do merge. O check acima já compilou out/; aqui só empacota.
      - name: Instalador do PR
        if: github.event_name == 'pull_request'
        run: npx electron-builder --win --publish never

      # RN-SEC-13: o que entrou no pacote, contra a lista do que pode entrar.
      - name: Auditoria do pacote
        if: github.event_name == 'pull_request'
        run: node scripts/audit-package.mjs dist/win-unpacked/resources

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: instalador-pr-${{ github.event.pull_request.number }}
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Onde baixar o instalador
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## Instalador deste PR'
            echo ''
            echo "Em **Artifacts**, no fim [desta página]($RUN_URL), o arquivo \`instalador-pr-*\`."
            echo 'É um .zip com o instalador dentro. Fica disponível por 7 dias.'
          } >> "$GITHUB_STEP_SUMMARY"
