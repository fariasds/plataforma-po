# Portões automáticos em todo PR e em todo push na main.
# O verify:neutral roda sem a lista de termos (ela não é pública) e só informa.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions fixadas por SHA de commit: uma tag pode ser movida, um SHA não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # RN-SEC-28: em todos os arquivos, não só nos do PR. Quem abre PR não roda o
      # hook de pre-commit; esta é a barreira que vale para todos.
      - name: Varredura de credenciais
        run: node scripts/scan-secrets.mjs

      - run: npm ci

      - run: npm run check
