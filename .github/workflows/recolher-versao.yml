# Freio de emergência para uma versão publicada com problema (docs/ESTEIRA.md,
# "Versão saiu com problema"). Tira a versão de "mais recente": quem ainda não
# atualizou para de ver o aviso dela (RN-GLB-18), e a anterior volta a ser a
# mais recente. Quem já instalou continua nela até a correção sair.
#
# Não é a correção. A correção é sempre uma versão maior com o código bom, pela
# esteira normal. Este workflow só para o estrago enquanto ela não sai.
name: Recolher versão

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a recolher, sem o v (ex.: 1.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A mesma aprovação de publicar: mexer no que todo app instalado vê é a mesma decisão.
    environment: producao
    permissions:
      contents: write
    steps:
      - name: Recolher e devolver a anterior
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          # A versão entra por variável e é conferida antes de qualquer uso.
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: use o formato 1.3.0." >&2
            exit 1
          fi
          tag="v$VERSAO"
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false || {
            echo "$tag não está publicada." >&2
            exit 1
          }

          # A anterior: a maior versão publicada, não pré-lançamento, abaixo desta.
          # sort -V ordena como versão (v1.10.0 depois de v1.9.0); a anterior é a
          # linha logo acima da recolhida.
          previous=$( { gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$tag"; } | sort -uV | grep -B1 -x "$tag" | head -1)
          if [ -z "$previous" ] || [ "$previous" = "$tag" ]; then
            echo "Não há versão publicada anterior a $tag para voltar a ser a mais recente." >&2
            exit 1
          fi

          gh release edit "$tag" --prerelease --latest=false
          gh release edit "$previous" --latest

          {
            echo "## $tag recolhida"
            echo ''
            echo "- $tag virou pré-lançamento e saiu de \`releases/latest\`: quem ainda não atualizou não vê mais o aviso dela."
            echo "- $previous voltou a ser a mais recente."
            echo '- Quem já instalou continua nela até a correção.'
            echo ''
            echo '**Falta a correção:** reverta o PR problemático na main e suba a versão (por exemplo, de 1.3.0 para 1.3.1). A esteira publica com a sua aprovação, e o aviso de versão nova leva todo mundo para ela.'
          } >> "$GITHUB_STEP_SUMMARY"
