<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Plataforma do PO</title>
    <!--
      https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
      connect-src is 'self' only: the renderer talks to no external host. Azure
      DevOps is called by the main process, so the renderer never reaches it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
